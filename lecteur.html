<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISSI-PROD — Catalogue</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe id="pdfViewer"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const page = parseInt(params.get("page")) || 5;

    const pdf =
      "https://kissiprod95-max.github.io/catalogue-officiel-kissi-prod.pdf";

    const viewer =
      "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
      encodeURIComponent(pdf) +
      "#page=" + page;

    document.getElementById("pdfViewer").src = viewer;
  </script>

</body>
</html>
