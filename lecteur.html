<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KISSI-PROD — Catalogue</title>
</head>

<body>

<script>
  const params = new URLSearchParams(window.location.search);
  const page = parseInt(params.get("page")) || 5;

  const pdf = "https://kissiprod95-max.github.io/catalogue-officiel-kissi-prod.pdf";

  const viewer =
    "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
    encodeURIComponent(pdf) +
    "#page=" + page;

  window.location.replace(viewer);
</script>

</body>
</html>
