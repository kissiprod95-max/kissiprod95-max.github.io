<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fiche du catalogue - KISSI-PROD</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <iframe id="viewer"></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const page = parseInt(params.get("page")) || 5;

    const viewer = document.getElementById("viewer");

    viewer.src =
      "https://docs.google.com/gview?embedded=1&url=" +
      encodeURIComponent(
        "https://kissiprod95-max.github.io/catalogue-officiel-kissi-prod.pdf"
      );

    viewer.onload = function () {
      setTimeout(function () {
        try {
          viewer.contentWindow.location.hash = ":0.page." + (page - 1);
        } catch (e) {
          console.log("Navigation automatique indisponible");
        }
      }, 2500);
    };
  </script>

</body>
</html>
